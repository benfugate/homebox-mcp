name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # The same test image as a local run (see README), so CI and local agree.
      - name: Build test image
        run: docker build --target test -t homebox-mcp:test .
      - name: Offline tests
        run: docker run --rm homebox-mcp:test
      - name: Entry point starts and answers over stdio
        # stdin stays open a moment: at EOF the server stops before answering tools/list.
        run: |
          { printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 3; } \
            | docker run --rm -i -e HOMEBOX_URL=http://127.0.0.1:9 -e HOMEBOX_API_KEY=x homebox-mcp:test homebox-mcp \
            | tee /dev/stderr | grep -q '"list_locations"'
